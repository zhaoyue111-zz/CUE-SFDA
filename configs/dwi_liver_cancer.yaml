experiment:
  seed: 42
  gpu_id: 0
  output_dir: outputs/dwi_only_liver_cancer_expanded
data:
  image_dir: /data/hilab/datasets/WCH_MRI145/DWI/images
  split_json: /data/hilab/datasets/WCH_MRI145/DWI/split.json
  # Must match model/plans.json. VoxTell was trained and baseline-tested at 192^3.
  patch_size: [192, 192, 192]
model:
  voxtell_root: /home/ubuntu/zy/pythoncode/sfda/VoxTell_from_disk
  model_dir: /home/ubuntu/zy/pythoncode/sfda/VoxTell_from_disk/model
  text_encoder: /home/ubuntu/zy/pythoncode/sfda/VoxTell_from_disk/model/Qwen3-Embedding-4B
  prompt: liver cancer
  amp: true
  lora_rank: 8
  lora_alpha: 16.0
  lora_dropout: 0.0
  # Extend adapters to the text and final mask projections. The frozen source
  # path remains available because all adapters are disabled for the teacher.
  lora_linear_targets: [text_projection, final_mask_projection]
method:
  iterations: 1000
  calibration_cases: 0
  # Paper defaults: K=10, tau=0.8, gamma=0.5 for MRI.
  num_views: 10
  mixup_alpha: 0.75
  probability_threshold: 0.5
  chebyshev_threshold: 0.8
  quality_threshold: 0.5
  confidence_ema: 0.9
  # Stage-one confidence is measured with the fixed source model. Keeping the
  # split fixed prevents self-reinforcing branch migration during adaptation.
  source_only_confidence: true
  update_confidence_partition: false
  # Label-free foreground-aware case sampling: emphasize the reliable branch
  # whose source predictions contain usable tumor seeds.
  high_quality_sampling_probability: 0.75
  # Memory-safe 3-D approximation of the paper's K-view KL prototype.
  low_quality_views: 3
  style_mix_probability: 0.75
  noise_std: 0.08
  gamma_range: [0.7, 1.5]
  random_walk_size: [16, 32, 32]
  random_walk_steps: 4
  random_walk_alpha: 0.0
  affinity_temperature: 0.15
  # Preserve small tumor seeds when constructing the memory-bounded 3-D graph.
  random_walk_score_pooling: max
  preserve_raw_foreground: true
  min_pseudo_foreground_voxels: 8
  # Prevent 1--13 stable false-positive voxels from entering the high branch.
  min_case_pseudo_foreground_voxels: 64
train:
  learning_rate: 0.00001
  weight_decay: 0.0001
  tile_step_size: 0.5
  validation_every: 100
  validate_at_start: true
  max_grad_norm: 1.0
  high_dice_weight: 1.0
  high_bce_weight: 1.0
  high_foreground_weight: 5.0
  balance_high_bce: true
  low_consistency_weight: 1.0
  low_foreground_weight: 5.0
  balance_low_consistency: true
  low_entropy_weight: 0.0
  log_every: 10
  save_every: 100
evaluation:
  tile_step_size: 0.5
  threshold: 0.5
  label_value: 1
