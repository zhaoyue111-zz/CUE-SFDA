experiment:
  seed: 42
  gpu_id: 0
  output_dir: outputs/liver_expansion_control/runs/E3
data:
  image_dir: /data/hilab/datasets/WCH_MRI145/DWI/images
  split_json: /data/hilab/datasets/WCH_MRI145/DWI/split.json
  patch_size:
  - 192
  - 192
  - 192
model:
  voxtell_root: /home/ubuntu/zy/pythoncode/sfda/VoxTell_from_disk
  model_dir: /home/ubuntu/zy/pythoncode/sfda/VoxTell_from_disk/model
  text_encoder: /home/ubuntu/zy/pythoncode/sfda/VoxTell_from_disk/model/Qwen3-Embedding-4B
  prompt: whole liver
  amp: true
  lora_rank: 8
  lora_alpha: 16.0
  lora_dropout: 0.0
  lora_linear_targets:
  - text_projection
  - final_mask_projection
method:
  iterations: 2000
  calibration_cases: 0
  num_views: 10
  mixup_alpha: 0.75
  probability_threshold: 0.5
  chebyshev_threshold: 0.8
  quality_threshold: 0.5
  confidence_ema: 0.9
  source_only_confidence: true
  update_confidence_partition: false
  high_quality_sampling_probability: 0.75
  low_quality_views: 3
  style_mix_probability: 0.75
  noise_std: 0.08
  gamma_range:
  - 0.7
  - 1.5
  random_walk_size:
  - 16
  - 32
  - 32
  random_walk_steps: 4
  random_walk_alpha: 0.0
  affinity_temperature: 0.15
  random_walk_score_pooling: max
  preserve_raw_foreground: true
  min_pseudo_foreground_voxels: 8
  min_case_pseudo_foreground_voxels: 64
  routing_mode: joint_empty_to_low
  routing_uncertainty_csv: /home/ubuntu/zy/pythoncode/sfda/VoxTell_from_disk/diagnostic/dwi_uncertainty_liver/per_case_uncertainty.csv
  routing_reference_partition: /home/ubuntu/zy/pythoncode/sfda/CUE-SFDA/outputs/dwi_only_liver/confidence_partition.json
  routing_prompts:
  - liver
  - whole liver
  - liver organ
  - hepatic organ
  routing_high_cases: 59
train:
  learning_rate: 1.0e-05
  weight_decay: 0.0001
  tile_step_size: 0.5
  validation_every: 50
  early_stopping_patience: 10
  save_validation_predictions: false
  validate_at_start: true
  max_grad_norm: 1.0
  high_dice_weight: 1.0
  high_bce_weight: 1.0
  high_foreground_weight: 5.0
  balance_high_bce: true
  low_consistency_weight: 1.0
  low_foreground_weight: 5.0
  balance_low_consistency: true
  low_entropy_weight: 0.0
  log_every: 50
  save_every: 50
evaluation:
  tile_step_size: 0.5
  threshold: 0.5
  label_value: 1
dynamic_hard:
  mode: dynamic_hard
  cache_dir: outputs/liver_expansion_control/caches/E3/dynamic_hard_cache
  standard_prompt: liver
  prompts:
  - liver
  - whole liver
  - liver organ
  - hepatic organ
  image_temperature: 0.15
  prompt_temperature: 0.15
  lambda_consensus: 0.05
  confidence_threshold: 0.0
  refresh_tile_step_size: 1.0
  max_refresh_cycles: 1
high_selection:
  mode: semantic_subspace
  reference_count: 8
  reference_refresh_interval: 100
  significance_level: 0.05
  spectral_energy: 0.9
  robust_mad_multiplier: 3.0
  tokens_per_case: 256
liver_adaptation:
  experiment: E3
  teacher_cache_dir: outputs/liver_expansion_control/source_teacher_cache
  volume_constraint:
    weight: 1.0
    margin: 0.1
    shrink_weight: 1.0
    epsilon: 1.0e-06
    minimum_teacher_volume: 1000.0
  remote_background:
    weight: 0.1
    foreground_threshold: 0.5
    probability_max: 0.1
    distance_mm: 15.0
  regions:
    loss_weight: 0.1
    foreground_threshold: 0.5
    remote_distance_mm: 15.0
    boundary_width_mm: 5.0
    interior_weight: 1.0
    boundary_weight: 0.25
    background_weight: 1.0
  anchor:
    weight: 0.1
